name: Tests

# The mechanical floor. It cannot catch "the tests miss a permutation" — v0.9.7 shipped
# a bug past 28 assertions and a green geometry pass — but it does catch the failure this
# repo actually had for its whole life, which is no tests running at all.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # macos-15 CANNOT build this project. Services/Voice/VoiceEngine.swift uses
    # SpeechAnalyzer / SpeechTranscriber / SpeechDetector, which are macOS 26 APIs — and
    # `@available(macOS 26, *)` does not help, because the SDK has to CONTAIN the symbols
    # to compile at all. The deployment target stays macOS 14; it is the SDK that must be
    # new, not the floor.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          echo "SDK: $(xcrun --show-sdk-version --sdk macosx)"

      # Fail loudly and early if the runner image regresses to an SDK that cannot see
      # the Speech APIs — otherwise the failure surfaces 90 seconds later as a wall of
      # "cannot find type in scope" that reads like a code error rather than an image one.
      - name: Require an SDK new enough for the Speech APIs
        run: |
          set -euo pipefail
          SDK=$(xcrun --show-sdk-version --sdk macosx)
          echo "macOS SDK: $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::SDK $SDK is too old — VoiceEngine needs the macOS 26 Speech APIs."
            exit 1
          fi

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # A suite that runs zero tests must FAIL, not pass quietly. Earned the hard way:
      # geometry-pass.py's first run compared zero grid pushes because the beta had no
      # open tabs, and a check that measures nothing looks exactly like a check that
      # passed. Any green here must mean assertions actually executed.
      - name: Refuse a silent pass
        run: |
          set -euo pipefail
          COUNT=$(swift test --list-tests 2>/dev/null | grep -c . || echo 0)
          echo "discovered tests: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::No tests were discovered — a green run here would mean nothing."
            exit 1
          fi
